<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Competition</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="competition.css">
</head>
<body>
  <main class="competition-browser" aria-label="Competition page browser">
    <section class="competition-column competition-index" aria-label="Competitors">
      <header class="column-title">
        <span id="viewTitle">Landing</span>
        <span id="competitorCount">28</span>
      </header>
      <nav class="competitor-list" id="competitorList"></nav>
    </section>

    <div class="column-divider" data-divider="list" role="separator" aria-label="Resize competition list" aria-orientation="vertical" tabindex="0"></div>

    <aside class="competition-column notes-column" aria-label="Notes for selected competitor">
      <header class="notes-title">
        <div>
          <span id="selectedKind">Landing</span>
          <strong id="selectedName">Aircall</strong>
        </div>
        <button class="like" id="likeButton" type="button" aria-pressed="false" title="Mark as something we like"><span aria-hidden="true">☆</span><span>Like</span></button>
      </header>

      <section class="note-field likes-field">
        <label for="likes">Things we like</label>
        <textarea id="likes" placeholder="Message, structure, proof, pricing mechanics…"></textarea>
      </section>

      <section class="note-field main-notes">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Click a competitor and start typing."></textarea>
      </section>

      <footer class="notes-footer">
        <span id="saveStatus" aria-live="polite">Saved locally</span>
        <a id="chatLink" href="#" target="_blank" rel="noreferrer">Chat about this ↗</a>
      </footer>
    </aside>

    <div class="column-divider" data-divider="notes" role="separator" aria-label="Resize notes column" aria-orientation="vertical" tabindex="0"></div>

    <section class="competition-column live-column" aria-label="Live competitor page">
      <header class="live-toolbar">
        <div class="live-title"><span id="pageKind">Landing</span><strong id="viewerName">Aircall</strong></div>
        <div class="live-actions">
          <div class="source-switch" aria-label="Viewer source">
            <button id="imageView" type="button" class="active" aria-pressed="true">Page image</button>
            <button id="iframeView" type="button" aria-pressed="false">Live iframe</button>
          </div>
          <div class="device-switch" aria-label="Preview width">
            <button id="desktopView" type="button" class="active" aria-pressed="true">Desktop web</button>
            <button id="mobileView" type="button" aria-pressed="false">Mobile web</button>
          </div>
          <a id="liveLink" href="#" target="_blank" rel="noreferrer">Live page ↗</a>
          <a id="mobbinLink" href="https://mobbin.com/browse/web/apps" target="_blank" rel="noreferrer">Mobbin ↗</a>
        </div>
      </header>
      <div class="viewer-stage mode-image" id="viewerStage">
        <div class="viewer-shell image-shell" id="imageShell">
          <div class="source-status" id="sourceStatus">Saved page image</div>
          <img id="referenceImage" alt="Aircall landing page">
        </div>
        <div class="viewer-shell iframe-shell" id="iframeShell">
          <iframe id="liveFrame" title="Live competitor page" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script src="competition-data.js"></script>
  <script src="competition.js"></script>
</body>
</html>
