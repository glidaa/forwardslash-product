<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>forwardslash.ch — Explainer script studio</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap");
    :root{--black:#080808;--panel:#101010;--raised:#161616;--line:#2a2a2a;--text:#f4f4f1;--muted:#8f8f8b;--soft:#c9c9c4}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--black);color:var(--text);font:14px/1.55 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:2px solid #fff;outline-offset:2px}
    .app{display:grid;grid-template-columns:250px minmax(420px,1fr) 340px;min-height:100vh}.left,.right{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:9px;height:70px;padding:0 22px;border-bottom:1px solid var(--line);font:600 17px/1 Space Grotesk,sans-serif;letter-spacing:-.02em}.mark{font-size:29px;font-weight:500}.dot{color:#777}.label{color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
    .side-head{padding:23px 20px 14px}.script-nav{padding:0 10px 20px}.script-button{width:100%;display:grid;grid-template-columns:29px 1fr;gap:10px;padding:13px 11px;border:0;border-radius:7px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.script-button:hover{background:#171717;color:#fff}.script-button.active{background:#fff;color:#0a0a0a}.script-button .num{font:500 11px Space Grotesk,sans-serif}.script-button b{display:block;margin-bottom:2px;font-size:12px}.script-button span:last-child{display:block;font-size:10px;line-height:1.35;opacity:.68}
    .main{min-width:0;padding:48px clamp(32px,6vw,92px) 64px}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:62px}.counter{color:var(--muted);font-size:11px}.nav-arrows{display:flex;gap:7px}.icon-button,.copy{border:1px solid var(--line);border-radius:6px;background:transparent;color:#ddd;cursor:pointer}.icon-button{width:35px;height:35px;font-size:17px}.icon-button:hover,.copy:hover{border-color:#777;background:#171717}
    .script-kicker{margin-bottom:18px}.title{max-width:740px;margin:0;font:600 clamp(38px,5vw,68px)/.99 Space Grotesk,sans-serif;letter-spacing:-.045em;text-wrap:balance}.position{max-width:670px;margin:20px 0 42px;color:var(--muted);font-size:15px}.script-card{max-width:800px;padding:30px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}.script-text{margin:0;color:#f4f4f1;font:400 clamp(19px,2.2vw,28px)/1.5 Space Grotesk,sans-serif;letter-spacing:-.02em}.script-meta{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:27px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.copy{padding:8px 12px}.direction{max-width:800px;margin-top:34px;padding-top:25px;border-top:1px solid var(--line);display:grid;grid-template-columns:130px 1fr;gap:20px}.direction p{margin:0;color:var(--muted)}
    .right-tabs{position:sticky;top:0;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}.tab{height:70px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}.tab.active{background:#fff;color:#0a0a0a}.bank{padding:12px}.bank[hidden]{display:none}.bank-intro{padding:12px 8px 17px;color:var(--muted);font-size:11px}.line-item{position:relative;width:100%;padding:13px 38px 13px 12px;border:0;border-bottom:1px solid #242424;background:transparent;color:#d7d7d3;text-align:left;cursor:pointer;font-size:12px;line-height:1.45}.line-item:hover{background:#171717;color:#fff}.line-item:after{position:absolute;right:12px;top:14px;content:"Copy";color:#666;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.line-item.copied:after{content:"Copied";color:#fff}
    .mobile-select{display:none;width:100%;margin-bottom:28px;padding:12px;border:1px solid var(--line);border-radius:7px;background:#111;color:#fff}
    @media(max-width:1050px){.app{grid-template-columns:210px 1fr}.right{position:relative;grid-column:1/-1;height:auto;border-top:1px solid var(--line);border-left:0}.bank{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.bank-intro{grid-column:1/-1}.right-tabs{position:relative}}
    @media(max-width:720px){.app{display:block}.left{position:relative;height:auto;border-right:0}.script-nav{display:none}.side-head{display:none}.brand{height:60px}.main{padding:35px 20px 48px}.mobile-select{display:block}.topline{margin-bottom:34px}.title{font-size:42px}.script-card{padding:22px}.script-text{font-size:20px}.direction{grid-template-columns:1fr;gap:6px}.right{position:relative}.bank{grid-template-columns:1fr}.right-tabs .tab{height:56px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="left">
    <div class="brand"><span class="mark">/</span><span>forwardslash<span class="dot">.ch</span></span></div>
    <div class="side-head"><div class="label">Five explainer scripts</div></div>
    <nav class="script-nav" id="scriptNav" aria-label="Explainer scripts"></nav>
  </aside>

  <main class="main">
    <select class="mobile-select" id="mobileSelect" aria-label="Choose script"></select>
    <div class="topline"><span class="counter" id="counter"></span><div class="nav-arrows"><button class="icon-button" id="previous" aria-label="Previous script">←</button><button class="icon-button" id="next" aria-label="Next script">→</button></div></div>
    <div class="script-kicker label" id="kicker"></div>
    <h1 class="title" id="title"></h1>
    <p class="position" id="position"></p>
    <article class="script-card">
      <p class="script-text" id="scriptText"></p>
      <div class="script-meta"><span><span id="wordCount"></span> words · approximately 36 seconds</span><button class="copy" id="copyScript">Copy script</button></div>
    </article>
    <div class="direction"><div class="label">Delivery direction</div><p id="direction"></p></div>
  </main>

  <aside class="right">
    <div class="right-tabs"><button class="tab active" data-bank="starts">30 starts</button><button class="tab" data-bank="ctas">30 calls to action</button></div>
    <div class="bank" id="starts"></div>
    <div class="bank" id="ctas" hidden></div>
  </aside>
</div>
<script>
const scripts=[
{title:"From research to revenue",kicker:"01 · Complete product",position:"The broad explainer: one connected system for finding, reaching and converting customers.",direction:"Calm and assured. Begin with quiet research screens, then gather pace through email, calling and bookings. End on one clean overview of meetings and delivered sales.",text:"Finding customers should not mean stitching together ten different tools. forwardslash.ch helps you research a market, build a precise list, design a campaign and reach people by email, SMS or phone. Replies, calls and bookings stay connected to the same contact. Run an event, manage guests and sign-ups, share an online booking page, then follow every opportunity through to the meeting and the sale. One calm workspace shows what is happening, what needs attention and what was delivered without losing the relationship. Start with one useful list. Grow from there."},
{title:"One campaign, properly run",kicker:"02 · Campaign-led",position:"For teams that need to research, plan, approve and execute an entire campaign.",direction:"Open on a blank campaign brief. Reveal audience, message, channels and approvals one at a time. Show a human approving before any outreach begins.",text:"A good campaign begins before the first message. In forwardslash.ch, research the market, define the audience and build a clean contact list. Shape the offer, write the email, plan the calls and prepare the SMS follow-up. Review the audience, message, timing and cost before anything runs. Then manage replies, call outcomes, meeting bookings and next steps in one place. You can see which activity created a real conversation and which conversations became sales, with everyone clearly understanding the outcome. Thoughtful planning. Controlled execution. Clear results. Build your first campaign free."},
{title:"Events that continue",kicker:"03 · Events and guests",position:"For organisations running events, briefings, roundtables and follow-up programmes.",direction:"Use an event timeline: invitation, guest list, registration, attendance, follow-up, booking and opportunity. Keep the motion precise rather than celebratory.",text:"An event is more than a registration page. forwardslash.ch helps you research the right guests, build the invitation list and send thoughtful email or SMS. Track sign-ups, questions, dietary needs and attendance without losing the relationship behind each name. Share booking pages for private meetings before or after the event. Give your team a clear call list for important guests. When the event ends, follow replies, meetings and opportunities through to the work delivered without losing context. One guest list becomes a complete relationship programme. Start with your next event."},
{title:"The sales day, connected",kicker:"04 · Sales workflow",position:"For salespeople who move between research, email, calling, bookings and follow-up.",direction:"Follow one operator through a working day. Keep the interface mostly still; let the changing next action carry the sequence.",text:"Your sales day should not disappear between tabs. forwardslash.ch brings research, contacts, email, calling, SMS and meeting bookings into one focused workspace. Begin with the people who matter. See the reason for every call, the last message and the right next action. Send the promised follow-up while the conversation is fresh. Share your booking page and keep the meeting connected to the campaign that created it. Managers see progress without chasing updates. Delivery receives the full customer context. Spend less time moving information. Spend more time moving relationships forward together."},
{title:"From first contact to delivery",kicker:"05 · Company operating system",position:"For leaders connecting demand generation, sales and the work promised to customers.",direction:"Begin with a single contact timeline and widen gradually to campaign, opportunity and delivery board. Close on the customer outcome, not an activity dashboard.",text:"Most systems stop when the deal is won. forwardslash.ch keeps going. Research and build the audience. Run email, SMS and calling campaigns with clear approvals and limits. Capture replies, schedule meetings and manage the opportunity without losing the original context. When the customer says yes, turn the promise into a project with owners, tasks and dates. Sales can see delivery. Delivery can see the relationship. Leadership can see what created demand and what produced a result. From first contact to finished work, the whole story stays clearly connected. Start free."}
];
const starts=[
"Finding customers should not require ten different tools.","A sale begins long before the first call.","What if one list could become an entire customer journey?","The best campaigns begin with a better understanding of who matters.","Your next customer may already be somewhere in your data.","Research. Reach out. Book the meeting. Deliver the work.","Most sales software records activity. Very little keeps the whole story.","An event should create relationships, not just registrations.","A spreadsheet is not a sales process—but it can be a useful beginning.","Every good call starts with knowing why you are making it.","Your sales day should not disappear between browser tabs.","The first message and the finished project belong to the same story.","A campaign is not finished when the emails have been sent.","You do not need more leads. You need clearer next actions.","The customer experiences one company, even when your team uses six systems.","Imagine seeing every contact, conversation and promise in one place.","A clean guest list can become a complete relationship programme.","Before you automate outreach, make the decision understandable.","The hardest part of sales is often the information lost between tools.","The right person. The right reason. The right next step.","Start with one useful contact—not a company-wide software rollout.","The quickest way to improve outreach may be to slow down before sending.","Your CRM should remember more than the fact that something happened.","From market research to booked meeting, context changes everything.","Calls work better when the caller can see the relationship.","A booking page is useful. A booking with complete context is better.","Sales creates the promise. Delivery proves whether it was true.","What happened after the positive reply? Your system should know.","Good software makes the next decision clearer.","forwardslash.ch connects the work before, during and after the sale."
];
const ctas=[
"Start with one useful list.","Build your first campaign free.","Upload a list and review everything before it runs.","Create a free workspace. No card required.","Plan your next campaign in forwardslash.ch.","Bring your next event guest list.","Connect your mailbox and send one real message.","Build a focused call list.","Create a booking page for your next conversation.","Start with a contact, a list or a project.","See how one campaign becomes delivered work.","Try the complete workflow for fourteen days.","Map your current sales process.","Bring one live opportunity into forwardslash.ch.","Prepare your next campaign for approval.","See the full pricing and feature comparison.","Start personally. Bring the company later.","Turn your spreadsheet into responsible next actions.","Give your next event one connected workspace.","Research the market before you reach it.","Make your next sales handover complete.","Invite the team without buying another seat.","Add a Campaign licence when you need scale.","Add a Calling licence when queues create value.","Book a short product walkthrough.","Show us the seam between your current tools.","Start free and keep your export.","Create the first project from a real customer promise.","See what your team could run in one place.","Begin at forwardslash.ch."
];
let current=0;
const nav=document.getElementById('scriptNav'),mobile=document.getElementById('mobileSelect');
scripts.forEach((s,i)=>{const b=document.createElement('button');b.className='script-button';b.innerHTML=`<span class="num">0${i+1}</span><span><b>${s.title}</b><span>${s.kicker.split(' · ')[1]}</span></span>`;b.onclick=()=>show(i);nav.appendChild(b);const o=document.createElement('option');o.value=i;o.textContent=`0${i+1} — ${s.title}`;mobile.appendChild(o)});
function show(i){current=(i+scripts.length)%scripts.length;const s=scripts[current];document.querySelectorAll('.script-button').forEach((b,n)=>b.classList.toggle('active',n===current));mobile.value=current;document.getElementById('counter').textContent=`Script 0${current+1} of 05`;document.getElementById('kicker').textContent=s.kicker;document.getElementById('title').textContent=s.title;document.getElementById('position').textContent=s.position;document.getElementById('scriptText').textContent=s.text;document.getElementById('direction').textContent=s.direction;document.getElementById('wordCount').textContent=s.text.trim().split(/\s+/).length;history.replaceState(null,'',`#script-${current+1}`)}
function fillBank(id,items){const bank=document.getElementById(id);const intro=document.createElement('div');intro.className='bank-intro';intro.textContent='Click any line to copy it.';bank.appendChild(intro);items.forEach((line,i)=>{const b=document.createElement('button');b.className='line-item';b.innerHTML=`<span style="color:#666;margin-right:8px">${String(i+1).padStart(2,'0')}</span>${line}`;b.onclick=()=>copy(line,b);bank.appendChild(b)})}
async function copy(text,button){try{await navigator.clipboard.writeText(text);button.classList.add('copied');setTimeout(()=>button.classList.remove('copied'),1200)}catch{button.classList.add('copied');setTimeout(()=>button.classList.remove('copied'),1200)}}
fillBank('starts',starts);fillBank('ctas',ctas);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.getElementById('starts').hidden=t.dataset.bank!=='starts';document.getElementById('ctas').hidden=t.dataset.bank!=='ctas'});
document.getElementById('previous').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);mobile.onchange=e=>show(Number(e.target.value));document.getElementById('copyScript').onclick=e=>copy(scripts[current].text,e.currentTarget);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
const initial=Math.max(0,Math.min(4,(Number(location.hash.replace('#script-',''))||1)-1));show(initial);
</script>
</body>
</html>
