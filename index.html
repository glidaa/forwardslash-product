  <style>
    .rail a {
      display: block;
      padding: 9px 10px;
      border-radius: 6px;
      color: #777;
      text-decoration: none;
      font-size: 11px;
    }
    .rail a:hover { background: #eee; color: #111; }
    .rail a.active { background: #111; color: #fff; }
    .content { padding: 0; height: calc(100vh - 64px); }
    #page { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .dock { display: none; }
    @media (max-width: 760px) {
      .layout { display: flex; flex-direction: column; }
      .rail {
        display: block;
        position: sticky;
        top: 64px;
        height: auto;
        max-height: 40vh;
        overflow: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 10px;
      }
      .content { height: calc(100vh - 64px - 40vh); }
    }
  </style>
</head>
