<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>forwardslash.ch — Empty state (mono sketch)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --ink: #151515;
      --white: #fff;
      --paper: #f6f6f3;
      --line: #deded9;
      --muted: #686864;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 56px 1fr;
      background: var(--white);
      color: var(--ink);
      font: 14px/1.55 Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .rail {
      border-right: 1px solid var(--line);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 18px;
      gap: 18px;
    }
    .mark {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      font: 600 22px/1 Space Grotesk, sans-serif;
      color: var(--ink);
      text-decoration: none;
    }
    .rail a.nav {
      width: 36px; height: 36px;
      border: 1px solid transparent;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .rail a.nav:hover { border-color: var(--line); color: var(--ink); }
    .rail a.nav.active { background: #111; color: #fff; border-color: #111; }
    .rail .spacer { flex: 1; }
    .rail .invite {
      width: 36px; height: 36px;
      border: 1px solid #111;
      border-radius: 6px;
      background: #111;
      color: #fff;
      display: grid; place-items: center;
      font: 600 16px Space Grotesk, sans-serif;
      text-decoration: none;
    }
    main {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: var(--white);
    }
    .empty {
      width: min(440px, 100%);
      text-align: left;
    }
    .glyph {
      width: 72px; height: 72px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      font: 600 42px/1 Space Grotesk, sans-serif;
      letter-spacing: -.06em;
      color: var(--ink);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #888;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 600 clamp(28px, 4vw, 36px)/1.05 Space Grotesk, sans-serif;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      max-width: 36em;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 39px;
      padding: 0 15px;
      border: 1px solid #111;
      border-radius: 6px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .btn.ghost {
      background: #fff;
      color: #111;
    }
    .meta {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: #999;
      font-size: 11px;
      letter-spacing: .04em;
    }
    .meta strong { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <aside class="rail" aria-label="App">
    <a class="mark" href="#" aria-label="forwardslash.ch">/</a>
    <a class="nav active" href="#" title="Projects">Pr</a>
    <a class="nav" href="#" title="Settings">Se</a>
    <div class="spacer"></div>
    <a class="invite" href="#" title="Invite">+</a>
  </aside>
  <main>
    <div class="empty">
      <div class="glyph" aria-hidden="true">/</div>
      <p class="eyebrow">Workspace</p>
      <h1>Create a project to get started.</h1>
      <p>No illustration. No blue. Craft starts with a blank, precise surface — then tasks, a page, or a list.</p>
      <div class="actions">
        <a class="btn" href="#">Create project</a>
        <a class="btn ghost" href="#">Open a sample</a>
      </div>
      <div class="meta">
        <strong>fs-prism sketch</strong> · replaces blue/pink stock empty-state · product-book tokens
      </div>
    </div>
  </main>
</body>
</html>
